# Sparse-RL baseline on LIBERO-Long with pi0.5 (PPO, binary outcome reward, Table 1). Same settings as
# libero_long_ppo_pi05_structrl.yaml without subtask rewards.
defaults:
  - env/libero_10@env.train
  - env/libero_10@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/bucket_syncer@weight_syncer  # patch_syncer delta-compare OOMed A100 node 40GB at first sync; bucket = plain trainable-only transfer, near-zero extra GPU mem
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 4
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_long_ppo_pi05_sparse"
    logger_backends: ["tensorboard"]

  max_epochs: 200
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 10

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0          # sparse: +1.0 on success
  rollout_epoch: 3          # WILD: 256 envs x 3 = 768 traj/step
  eval_rollout_epoch: 1
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level # GR00T-parity (upstream openpi example uses token_level)
  update_epoch: 4           # 4 PPO epochs per iteration, as in the paper runs
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.3      # WILD
  clip_ratio_low: 0.3       # WILD
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  train:
    total_num_envs: 256
    max_episode_steps: 1024   # LIBERO-Long horizon (NOT the 512 default; longest demo 505)
    max_steps_per_rollout_epoch: 1040  # 104 chunks of 10 (divisible by the per-rank batch); episodes still end at 1024 steps
    reward_coef: ${algorithm.reward_coef}
    use_fixed_reset_state_ids: False
    use_ordered_reset_state_ids: False
    done_shift:
      enabled: True           # success +1 at chunk k flows back to chunks 0..k via GAE
    init_params:
      ignore_done: True       # robosuite never self-terminates; RLinf bounds via max_episode_steps
      camera_heights: 256
      camera_widths: 256
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/train
  eval:
    total_num_envs: 80
    max_episode_steps: 1024
    max_steps_per_rollout_epoch: 1040  # 104 chunks of 10 (divisible by the per-rank batch); episodes still end at 1024 steps
    group_size: 1
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    init_params:
      ignore_done: True
      camera_heights: 256
      camera_widths: 256
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False      # no CPU offload
  pipeline_stage_num: 1
  model:
    model_path: "${oc.env:CKPT_ROOT}/RLinf-Pi05-LIBERO-130-fullshot-SFT"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 8   # 16 OOMed at first weight sync on A100 node 40GB (24MB short); global_batch unchanged -> pure grad-accum, SGD-identical
  global_batch_size: 512    # GR00T-parity: WILD used 512 SGD batch (768 traj/step collected)
  seed: 1234
  enable_offload: False

  model:
    model_path: "${oc.env:CKPT_ROOT}/RLinf-Pi05-LIBERO-130-fullshot-SFT"
    model_type: "openpi"
    num_steps: 10  # 10 denoising steps, as in evaluation
    add_value_head: True
    # Critic as in the RoboCasa365 pi0.5 recipe: a value head on the mean token of the frozen
    # PaliGemma prefix (2048-d), trained from scratch.
    openpi:
      value_after_vlm: True
      detach_critic_input: True

  optim:
    lr: 5.0e-6              # 1e-5 -> 5e-6, match the RoboCasa365 pi0.5 recipe. 1e-5 rode violent deep-Vs for 100+ steps.
    value_lr: 1.0e-4        # 3e-5 -> 1e-4, match the RoboCasa365 pi0.5 recipe and upstream pi0.5 recipes: fresh 2048-d vlm-value head must learn fast or advantages stay noisy
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0  # 5 -> 0, match the RoboCasa365 pi0.5 recipe; also warmup>0 rebuilds the optimizer and breaks resume (initial_lr is not restored)

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: False
    gradient_checkpointing: False # openpi: not supported, do not change
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False

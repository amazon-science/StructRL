# StructRL on LIBERO-Object with GR00T-N1.5 (PPO, Table 5), with the PPO settings of LIBERO-Long.
# libero/spatial_object_goal/pyhook adds the stage splits and the grasp predicate (LIBERO3_HOOK=1).
defaults:
  - env/libero_object@env.train
  - env/libero_object@env.eval
  - model/gr00t@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 4
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_object_ppo_gr00t_structrl"
    logger_backends: ["tensorboard"]

  max_epochs: 200
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 10

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: 3          # WILD: 2 -> 3 (512 -> 768 traj/step)
  eval_rollout_epoch: 1
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level

  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0          # WILD wanted 0.01 but GR00T action model returns entropy=None
                            # (gr00t_action_model.py default_forward); entropy_bonus>0 crashes
                            # at fsdp_actor_worker.py:1824. Exploration comes from temperature_train=1.0
                            # + clip widened to 0.3 instead.
  clip_ratio_high: 0.3      # WILD: 0.2 -> 0.3
  clip_ratio_low: 0.3       # WILD: 0.2 -> 0.3
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  train:
    total_num_envs: 64
    max_episode_steps: 256
    max_steps_per_rollout_epoch: 256
    reward_coef: ${algorithm.reward_coef}
    use_fixed_reset_state_ids: False
    use_ordered_reset_state_ids: False
    done_shift:
      enabled: True
    dense_reward:
      enabled: True
    init_params:
      ignore_done: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/train
  eval:
    total_num_envs: 80
    max_episode_steps: 256
    max_steps_per_rollout_epoch: 256
    group_size: 1
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    init_params:
      ignore_done: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1
  model:
    model_path: "${oc.env:CKPT_ROOT}/gr00t-n1.5-libero-object"
    precision: ${actor.model.precision}
    action_dim: 7
    num_action_chunks: 16
    denoising_steps: 4
    obs_converter_type: "libero"
    embodiment_tag: "new_embodiment"

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16
  global_batch_size: 512
  seed: 1234
  enable_offload: False

  model:
    model_path: "${oc.env:CKPT_ROOT}/gr00t-n1.5-libero-object"
    model_type: "gr00t"
    add_value_head: True
    action_dim: 7
    num_action_chunks: 16
    denoising_steps: 4
    obs_converter_type: "libero"
    embodiment_tag: "new_embodiment"

  optim:
    lr: 2.0e-5              # WILD: 1e-5 -> 2e-5
    value_lr: 3.0e-5        # WILD: 2e-5 -> 3e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 5  # WILD: 0 -> 5 (warm fresh value head first)

  fsdp_config:
    strategy: "fsdp"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False

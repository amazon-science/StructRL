# SimpleVLA-RL baseline on LIBERO-Long with pi0.5 (GRPO, Table 1), with the recipe of
# libero_long_grpo_gr00t_simplevla.yaml. Action chunk 10, 10 denoising steps.
defaults:
  - env/libero_10@env.train
  - env/libero_10@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/bucket_syncer@weight_syncer  # patch_syncer delta-compare OOMed A100 node 40GB at first sync; bucket = plain trainable-only transfer, near-zero extra GPU mem
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 4
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_long_grpo_pi05_simplevla"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 10

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True   # GRPO requires this; makes reward_coef a no-op
  kl_penalty: kl
  group_size: 8                # [SimpleVLA] 8 traj share 1 init state
  reward_coef: 1.0             # [SimpleVLA #1] sparse +1 (cancels under norm)
  rollout_epoch: 2             # 256 envs x 2 = 512 traj/step
  eval_rollout_epoch: 1
  reward_type: chunk_level     # GR00T/pi0.5-native (flow chunks, not tokens)
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 1
  adv_type: grpo               # [SimpleVLA]
  loss_type: actor             # [SimpleVLA] critic-free
  loss_agg_func: "token-mean"
  kl_beta: 0.0                 # [SimpleVLA #5]
  entropy_bonus: 0
  clip_ratio_high: 0.28        # [SimpleVLA #3] Clip-Higher
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: True         # [SimpleVLA #2] DAPO dynamic sampling
  rewards_lower_bound: 0.05    # drop all-fail groups (mean 0)
  rewards_upper_bound: 0.95    # drop all-success groups (mean 1)
  sampling_params:
    do_sample: True
    temperature_train: 1.6     # [SimpleVLA #4]
    temperature_eval: 0.6
    top_k: -1                  # [SimpleVLA] no top-k truncation
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  train:
    total_num_envs: 256
    group_size: ${algorithm.group_size}   # 8 consecutive envs share 1 init
    max_episode_steps: 1024   # LIBERO-Long horizon (longest demo 505)
    max_steps_per_rollout_epoch: 1040  # 104 chunks of 10 (divisible by the per-rank batch); episodes still end at 1024 steps
    reward_coef: ${algorithm.reward_coef}
    use_fixed_reset_state_ids: False
    use_ordered_reset_state_ids: False
    done_shift:
      enabled: True           # success done shifted so +1 lands in the GRPO score
    init_params:
      ignore_done: True
      camera_heights: 256
      camera_widths: 256
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/train
  eval:
    total_num_envs: 80
    max_episode_steps: 1024
    max_steps_per_rollout_epoch: 1040  # 104 chunks of 10 (divisible by the per-rank batch); episodes still end at 1024 steps
    group_size: 1
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    init_params:
      ignore_done: True
      camera_heights: 256
      camera_widths: 256
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False      # no CPU offload
  pipeline_stage_num: 1
  model:
    model_path: "${oc.env:CKPT_ROOT}/RLinf-Pi05-LIBERO-130-fullshot-SFT"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 8   # 16 OOMed at first weight sync on A100 node 40GB (24MB short); global_batch unchanged -> pure grad-accum, SGD-identical
  global_batch_size: 512
  seed: 1234
  enable_offload: False

  model:
    model_path: "${oc.env:CKPT_ROOT}/RLinf-Pi05-LIBERO-130-fullshot-SFT"
    model_type: "openpi"
    num_steps: 10  # 10 denoising steps, as in the SFT evaluation (openpi sample_actions default); overrides the model default of 5
    add_value_head: False     # [SimpleVLA] critic-free GRPO

  optim:
    lr: 5.0e-6                # dropped 1e-5 -> 5e-6 to match the RoboCasa365 pi0.5 recipe; 1e-5 ran 190 steps with violent deep-Vs (0.94 peaks, 0.60 dips). GRPO is critic-free so lr is the ONLY change (no value head to move).
    value_lr: 2.0e-5          # unused (no value head); kept for config schema
    adam_beta1: 0.9
    adam_beta2: 0.999         # [SimpleVLA] (PPO arms use 0.95)
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: False
    gradient_checkpointing: False # openpi: not supported, do not change
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False

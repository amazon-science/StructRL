# SimpleVLA-RL baseline on LIBERO-Long with GR00T-N1.5 (GRPO, binary outcome reward, Table 1), with the
# recipe of configs/robocasa365_grpo_gr00t_composite_seen.yaml: dynamic sampling, clip-higher
# 0.2 / 0.28, rollout temperature 1.6, no KL term, critic-free, group size 8.
defaults:
  - env/libero_10@env.train
  - env/libero_10@env.eval
  - model/gr00t@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_long_grpo_gr00t_simplevla"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  # -1 disables in-loop evaluation, as on RoboCasa365: the training SR is logged from the rollouts
  # (env/success_once) and the reported SR comes from the offline evaluation. This also avoids the
  # eval % env_world_size constraint with 4 nodes (env_world_size=32).
  val_check_interval: -1
  save_interval: 10

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True   # GRPO requires this; also makes reward_coef a no-op
  kl_penalty: kl
  group_size: 8                # [SimpleVLA] GRPO group: 8 traj share 1 init state
  reward_coef: 1.0             # [SimpleVLA #1] sparse +1 on success (cancels under norm)
  rollout_epoch: 2             # 256 envs x 2 = 512 traj/step (our budget)
  eval_rollout_epoch: 1
  reward_type: chunk_level     # GR00T-native (OpenVLA-OFT used token_level)
  logprob_type: chunk_level
  entropy_type: chunk_level

  update_epoch: 1
  adv_type: grpo               # [SimpleVLA] GRPO (was gae)
  loss_type: actor             # [SimpleVLA] critic-free (was actor_critic)
  loss_agg_func: "token-mean"
  kl_beta: 0.0                 # [SimpleVLA #5] No-KL
  entropy_bonus: 0             # GR00T: keep entropy bonus off
  clip_ratio_high: 0.28        # [SimpleVLA #3] Clip-Higher
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: True         # [SimpleVLA #2] Dynamic Sampling (DAPO)
  rewards_lower_bound: 0.05    # drop all-fail groups (group-mean reward == 0)
  rewards_upper_bound: 0.95    # drop all-success groups (group-mean reward == 1)
  sampling_params:
    do_sample: True
    temperature_train: 1.6     # [SimpleVLA #4] higher rollout temperature
    temperature_eval: 0.6
    top_k: -1                  # [SimpleVLA] no top-k truncation
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  train:
    total_num_envs: 64
    group_size: ${algorithm.group_size}   # env groups 8 consecutive envs to 1 init
    max_episode_steps: 1024
    max_steps_per_rollout_epoch: 1024
    reward_coef: ${algorithm.reward_coef}
    # Random reset for training (no eval-init leakage). 8 members of each GRPO
    # group share one randomly-drawn init state (reset_state_ids.repeat(8)).
    use_fixed_reset_state_ids: False
    use_ordered_reset_state_ids: False
    # done_shift: shift success-driven done forward one chunk so the +1 terminal
    # reward is counted by GRPO's trajectory score (scores reset at dones[step+1])
    # rather than masked out. Gate requires auto_reset=False +
    # ignore_terminations=False (both inherited from libero_10).
    done_shift:
      enabled: True
    # ignore_done=True so robosuite never self-terminates at its internal horizon
    # (1000); RLinf alone bounds the episode via max_episode_steps=1024. Success
    # detection unaffected (terminations come from _check_success()).
    init_params:
      ignore_done: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/train
  eval:
    # In-training val sanity only (val_check_interval=-1 so it does not fire).
    # Authoritative 500-init SR via offline CSV. group_size=1 for eval.
    total_num_envs: 80
    max_episode_steps: 1024
    max_steps_per_rollout_epoch: 1024
    group_size: 1
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    init_params:
      ignore_done: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1
  model:
    model_path: "${oc.env:CKPT_ROOT}/gr00t-n1.5-libero-long"
    precision: ${actor.model.precision}
    action_dim: 7
    num_action_chunks: 16
    denoising_steps: 4
    obs_converter_type: "libero"
    embodiment_tag: "new_embodiment"

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16
  global_batch_size: 512
  seed: 1234
  enable_offload: False

  model:
    model_path: "${oc.env:CKPT_ROOT}/gr00t-n1.5-libero-long"
    model_type: "gr00t"
    add_value_head: False       # [SimpleVLA] critic-free GRPO
    action_dim: 7
    num_action_chunks: 16
    denoising_steps: 4
    obs_converter_type: "libero"
    embodiment_tag: "new_embodiment"

  optim:
    lr: 2.0e-5                   # [SimpleVLA] actor lr
    adam_beta1: 0.9
    adam_beta2: 0.999            # [SimpleVLA] (PPO baseline used 0.95)
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0

  fsdp_config:
    strategy: "fsdp"
    # CRITICAL for critic-free GRPO. The model's hardcoded _no_split_modules
    # (gr00t_action_model.py) lists "ValueHead", but add_value_head=False means no
    # ValueHead module exists, so get_fsdp_wrap_policy's auto path raises "Could not
    # find the transformer layer class to wrap". Override the wrap targets with the
    # same GR00T classes MINUS ValueHead so FSDP wraps only modules that exist.
    wrap_policy:
      transformer_layer_cls_to_wrap:
        - Eagle2_5_VLForConditionalGeneration
        - FlowMatchingActionHeadForRLActionPrediction
        - TimestepEncoder
        - TimestepEmbedding
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False

# PPO with GR00T-N1.5 on the 16 RoboCasa365 Composite-Seen tasks, shared by StructRL, Sparse-RL and the
# reward ablations; the launcher selects the reward (env.train.dense_reward.enabled and
# STRUCTRL_REWARD_VARIANT). 256 parallel environments x 2 rollout epochs = 512 rollouts per iteration;
# action chunk 16, 4 denoising steps, lr 1e-5, value lr 2e-5, clip 0.2.
defaults:
  - env/robocasa365_composite_seen@env.train
  - env/robocasa365_composite_seen@env.eval
  - model/gr00t@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 4
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "robocasa365_ppo_gr00t_composite_seen"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 10

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  # 256 envs over 16 tasks = 16 envs/task; rollout_epoch=2 -> 32 trajectories
  # per task per Global Step (closer to the single-task KB density of 256 on 1
  # task). Sampling wall-clock scales linearly with rollout_epoch (epochs are
  # serial), so this doubles collection time.
  rollout_epoch: 2
  eval_rollout_epoch: 1

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level

  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    # 16 composite_seen tasks, round-robin over 256 envs -> 16 envs/task.
    # total_num_envs must be divisible by env_world_size (32) and ideally by 16.
    # 256 = 32*8 (8 envs/card) and 256/16 = 16.
    total_num_envs: 256
    max_episode_steps: 2900
    max_steps_per_rollout_epoch: 2912
    reward_coef: ${algorithm.reward_coef}
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: False
  eval:
    total_num_envs: 32
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1
  model:
    model_path: "${oc.env:PROJECT_ROOT}/ckpts/gr00t_n1-5/foundation_model_learning/target_posttraining/composite_seen/checkpoint-60000"
    precision: ${actor.model.precision}
    # RoboCasa365 alignment — override gr00t model defaults (libero).
    action_dim: 12
    num_action_chunks: 16
    denoising_steps: 4
    obs_converter_type: "robocasa365"
    embodiment_tag: "new_embodiment"

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  # micro_batch=16 per card (same density as the validated KB run), global=512
  # over world_size=32 -> batch_size_per_rank = 512/32 = 16, grad_accum = 1.
  # 512 % (16*32) == 0. Larger global batch lowers gradient variance across the
  # 16 mixed tasks (32 chunks/task per update vs 16 at global=256).
  micro_batch_size: 16
  global_batch_size: 512
  seed: 1234
  enable_offload: False

  # IBRL knobs — disabled by default; flip enable_sft_co_train + ibrl_mode in
  # the sbatch overrides for fix/dynamic BC runs. sft_data_path is a 16-element
  # list (one per composite_seen task), routed through LeRobotMixtureDataset
  # with equal weights + balance_dataset_weights=True (so per-task BC sampling
  # is roughly trajectory-length-balanced).
  enable_sft_co_train: False
  sft_data_path:
    - "${oc.env:PROJECT_ROOT}/datasets/v1.0/target/composite/DeliverStraw/20250813/lerobot"
    - "${oc.env:PROJECT_ROOT}/datasets/v1.0/target/composite/GetToastedBread/20250812/lerobot"
    - "${oc.env:PROJECT_ROOT}/datasets/v1.0/target/composite/KettleBoiling/20250814/lerobot"
    - "${oc.env:PROJECT_ROOT}/datasets/v1.0/target/composite/LoadDishwasher/20250811/lerobot"
    - "${oc.env:PROJECT_ROOT}/datasets/v1.0/target/composite/PackIdenticalLunches/20250815/lerobot"
    - "${oc.env:PROJECT_ROOT}/datasets/v1.0/target/composite/PreSoakPan/20250809/lerobot"
    - "${oc.env:PROJECT_ROOT}/datasets/v1.0/target/composite/PrepareCoffee/20250812/lerobot"
    - "${oc.env:PROJECT_ROOT}/datasets/v1.0/target/composite/RinseSinkBasin/20250816/lerobot"
    - "${oc.env:PROJECT_ROOT}/datasets/v1.0/target/composite/ScrubCuttingBoard/20250816/lerobot"
    - "${oc.env:PROJECT_ROOT}/datasets/v1.0/target/composite/SearingMeat/20250812/lerobot"
    - "${oc.env:PROJECT_ROOT}/datasets/v1.0/target/composite/SetUpCuttingStation/20250817/lerobot"
    - "${oc.env:PROJECT_ROOT}/datasets/v1.0/target/composite/StackBowlsCabinet/20250815/lerobot"
    - "${oc.env:PROJECT_ROOT}/datasets/v1.0/target/composite/SteamInMicrowave/20250814/lerobot"
    - "${oc.env:PROJECT_ROOT}/datasets/v1.0/target/composite/StirVegetables/20250814/lerobot"
    - "${oc.env:PROJECT_ROOT}/datasets/v1.0/target/composite/StoreLeftoversInBowl/20250813/lerobot"
    - "${oc.env:PROJECT_ROOT}/datasets/v1.0/target/composite/WashLettuce/20250814/lerobot"
  sft_data_config: "rlinf.models.embodiment.gr00t.sft_data_config:RobocasaPandaOmronSFTConfig"
  sft_loss_weight: 0.1
  sft_num_workers: 2
  ibrl_mode: "off"            # off | fixed | dynamic
  ibrl_lambda_max: 0.8
  ibrl_window_size: 128

  model:
    model_path: "${oc.env:PROJECT_ROOT}/ckpts/gr00t_n1-5/foundation_model_learning/target_posttraining/composite_seen/checkpoint-60000"
    model_type: "gr00t"
    add_value_head: True
    # RoboCasa365 alignment.
    action_dim: 12
    num_action_chunks: 16
    denoising_steps: 4
    obs_converter_type: "robocasa365"
    embodiment_tag: "new_embodiment"
    # RoboCasa365 uses 3 camera views -> 3*256 image tokens + task text ~= 821
    # seq len. The libero default (570) truncates ~232 image placeholders,
    # so eagle_input_ids must be padded to a length that covers the full
    # 3-view sequence. rollout reuses actor.model, so set it here only.
    rl_head_config:
      padding_value: 1024

  optim:
    lr: 1.0e-5
    value_lr: 2.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    # shard_grad_op (ZeRO-2) keeps params resident across the BC+PPO double
    # forward used by IBRL co-train. full_shard would reshard after the first
    # forward and break the second forward's autograd graph.
    sharding_strategy: "shard_grad_op"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False

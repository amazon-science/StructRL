# GRPO with GR00T-N1.5 on RoboCasa365 Composite-Seen: the SimpleVLA-RL baseline (binary outcome reward)
# and StructRL-GRPO (rollout return = summed StructRL chunk rewards, see
# launch/train_gr00t_structrl_grpo.sbatch). Our port of the SimpleVLA-RL recipe (arXiv:2509.09674):
# dynamic sampling (all-fail and all-success groups are dropped), clip-higher 0.2 / 0.28, rollout
# temperature 1.6, no KL term, critic-free, group size 8, 512 rollouts per iteration.
# adv_type=grpo_diag is numerically identical to RLinf's grpo and also logs group statistics; the
# launchers put grpo_diag/ on PYTHONPATH to register it.
defaults:
  - env/robocasa365_composite_seen@env.train
  - env/robocasa365_composite_seen@env.eval
  - model/gr00t@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 4
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "robocasa365_grpo_gr00t_composite_seen"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 10

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True   # GRPO requires this; also makes reward_coef a no-op
  kl_penalty: kl
  group_size: 8                # [SimpleVLA] GRPO group: 8 traj share 1 init scene
  reward_coef: 1.0             # [SimpleVLA #1] sparse +1 on success (cancels under norm)
  rollout_epoch: 2             # 256 envs x 2 = 512 traj/step = 32 traj/task
  eval_rollout_epoch: 1

  reward_type: chunk_level     # GR00T-native (OpenVLA-OFT used token_level)
  logprob_type: chunk_level
  entropy_type: chunk_level

  update_epoch: 1
  adv_type: grpo_diag               # [SimpleVLA] GRPO (was gae)
  loss_type: actor             # [SimpleVLA] critic-free (was actor_critic)
  loss_agg_func: "token-mean"
  kl_beta: 0.0                 # [SimpleVLA #5] No-KL
  entropy_bonus: 0             # GR00T: entropy bonus off
  clip_ratio_high: 0.28        # [SimpleVLA #3] Clip-Higher
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: True         # [SimpleVLA #2] Dynamic Sampling (DAPO)
  filter_zero_var_groups: True   # [DIAG] drop zero-variance groups (all rollouts same reward -> std==0) from loss denominator; measured via grpo_diag dump
  rewards_lower_bound: 0.05    # drop all-fail groups (group-mean reward == 0)
  rewards_upper_bound: 0.95    # drop all-success groups (group-mean reward == 1)
  sampling_params:
    do_sample: True
    temperature_train: 1.6     # [SimpleVLA #4] higher rollout temperature
    temperature_eval: 0.6
    top_k: -1                  # [SimpleVLA] no top-k truncation
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    # 16 composite_seen tasks. 256 envs / 32 ranks = 8 envs/rank = 1 group/rank.
    # group_size=8 -> all 8 envs in a rank share one seed (one task+init scene).
    total_num_envs: 256
    group_size: ${algorithm.group_size}
    max_episode_steps: 2900
    max_steps_per_rollout_epoch: 2912
    reward_coef: ${algorithm.reward_coef}
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: False
    # REQUIRED for sparse GRPO: calculate_scores() accumulates trajectory reward
    # backward and zeroes the accumulator at ~dones[step+1]. With the success
    # done at chunk k, stepping back across it would wipe the +1 -> a SUCCESS
    # trajectory would score 0 and GRPO's group baseline would see all-zeros.
    # done_shift moves the success done forward one chunk so the +1 propagates
    # back to chunk 0 (trajectory score = 1). Same fix as the sparse PPO path;
    # gate requires auto_reset=False + ignore_terminations=False (RoboCasa365 defaults).
    done_shift:
      enabled: True
    dense_reward:
      enabled: False
  eval:
    total_num_envs: 32
    group_size: 1
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1
  model:
    model_path: "${oc.env:PROJECT_ROOT}/ckpts/gr00t_n1-5/foundation_model_learning/target_posttraining/composite_seen/checkpoint-60000"
    precision: ${actor.model.precision}
    action_dim: 12
    num_action_chunks: 16
    denoising_steps: 4
    obs_converter_type: "robocasa365"
    embodiment_tag: "new_embodiment"

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16
  global_batch_size: 512
  seed: 1234
  enable_offload: False

  model:
    model_path: "${oc.env:PROJECT_ROOT}/ckpts/gr00t_n1-5/foundation_model_learning/target_posttraining/composite_seen/checkpoint-60000"
    model_type: "gr00t"
    add_value_head: False       # [SimpleVLA] critic-free GRPO
    action_dim: 12
    num_action_chunks: 16
    denoising_steps: 4
    obs_converter_type: "robocasa365"
    embodiment_tag: "new_embodiment"
    # RoboCasa365 uses 3 camera views -> ~821 seq len; pad eagle_input_ids so the
    # libero default (570) does not truncate the 3-view image placeholders.
    rl_head_config:
      padding_value: 1024

  optim:
    lr: 2.0e-5                   # [SimpleVLA] actor lr
    adam_beta1: 0.9
    adam_beta2: 0.999            # [SimpleVLA] (PPO baseline used 0.95)
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0

  fsdp_config:
    strategy: "fsdp"
    # Match the PPO sparse baseline's ZeRO-2.
    sharding_strategy: "shard_grad_op"
    # CRITICAL for critic-free GRPO. The model's hardcoded _no_split_modules
    # (gr00t_action_model.py) lists "ValueHead", but add_value_head=False means no
    # ValueHead module exists, so get_fsdp_wrap_policy's auto path raises "Could not
    # find the transformer layer class to wrap". Override the wrap targets with the
    # same GR00T classes MINUS ValueHead so FSDP wraps only modules that exist.
    wrap_policy:
      transformer_layer_cls_to_wrap:
        - Eagle2_5_VLForConditionalGeneration
        - FlowMatchingActionHeadForRLActionPrediction
        - TimestepEncoder
        - TimestepEmbedding
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False

# GRPO with pi0.5 on RoboCasa365 Composite-Seen: the SimpleVLA-RL baseline and StructRL-GRPO, with the
# SimpleVLA-RL recipe of robocasa365_grpo_gr00t_composite_seen.yaml (adv_type=grpo). The launchers set
# 10 denoising steps; PI05_SFT_CKPT points to the SFT checkpoint.
defaults:
  - env/robocasa365_composite_seen@env.train
  - env/robocasa365_composite_seen@env.eval
  - model/pi0_5_robocasa365@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 4
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "robocasa365_grpo_openpi_pi05_composite_seen"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 10

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True   # GRPO requires this; also makes reward_coef a no-op
  kl_penalty: kl
  group_size: 8                # [SimpleVLA] GRPO group: 8 traj share 1 init scene
  reward_coef: 1.0             # [SimpleVLA #1] sparse +1 on success (cancels under norm)
  rollout_epoch: 2             # 256 envs x 2 = 512 traj/step = 32 traj/task
  eval_rollout_epoch: 1

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level

  update_epoch: 1
  adv_type: grpo               # [SimpleVLA] GRPO (was gae)
  loss_type: actor             # [SimpleVLA] critic-free (was actor_critic)
  loss_agg_func: "token-mean"
  kl_beta: 0.0                 # [SimpleVLA #5] No-KL
  entropy_bonus: 0
  clip_ratio_high: 0.28        # [SimpleVLA #3] Clip-Higher
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: True         # [SimpleVLA #2] Dynamic Sampling (DAPO)
  rewards_lower_bound: 0.05    # drop all-fail groups (group-mean reward == 0)
  rewards_upper_bound: 0.95    # drop all-success groups (group-mean reward == 1)
  sampling_params:
    do_sample: True
    temperature_train: 1.6     # [SimpleVLA #4] higher rollout temperature
    temperature_eval: 0.6
    top_k: -1                  # [SimpleVLA] no top-k truncation
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    total_num_envs: 256
    max_episode_steps: 2900
    max_steps_per_rollout_epoch: 2912
    reward_coef: ${algorithm.reward_coef}
    group_size: ${algorithm.group_size}
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: False
    # The pi0.5 SFT policy was trained on the target split; roll out on the same split.
    rldx_robocasa_split: target
    # sparse GRPO credit-assignment: success done at chunk k must propagate the
    # +1 back to chunk 0, else a success trajectory scores 0 and the group
    # baseline sees all-zeros. Same as the GR00T-N1.5 GRPO and sparse PPO configs.
    done_shift:
      enabled: True
    dense_reward:
      enabled: False
  eval:
    total_num_envs: 32
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    group_size: 1
    # eval rollout feeds the SAME pi0.5 model -> needs the target split too.
    rldx_robocasa_split: target
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: robocasa365
  enable_offload: True
  pipeline_stage_num: 1
  model:
    model_path: "${oc.env:PI05_SFT_CKPT}"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16
  global_batch_size: 512
  seed: 1234
  enable_offload: False

  model:
    model_path: "${oc.env:PI05_SFT_CKPT}"
    model_type: "openpi"
    add_value_head: False       # [SimpleVLA] critic-free GRPO

  optim:
    lr: 2.0e-5                   # [SimpleVLA] actor lr
    value_lr: 2.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.999            # [SimpleVLA] (PPO baseline used 0.95)
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    # no_shard (=DDP, full replica per card). pi0.5's sync_model_to_rollout takes
    # the LOCAL state_dict; under shard_grad_op the trainable expert projections
    # stay in the root FSDP unit as a flat (non-DTensor) sharded param, so
    # materialize_tensor can't restore the full shape and the weight sync crashes
    # (shape mismatch 2048 vs flat 16457728). no_shard keeps every param a full
    # replica => byte-correct sync. Fits H200 140GB (OOMs on A100 node 40GB).
    # Same setting as the reference pi0.5 run.
    sharding_strategy: "no_shard"
    use_orig_params: False
    gradient_checkpointing: False # for openpi, gradient checkpointing is not supported, please do not change this value
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
